[package]
name = "your-language"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "your_language"

[[bin]]
name = "yl"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"
stacker = "0.1"
# Preserve Rust 1.85 support for the stack-growth backend.
psm = "=0.1.24"
regex = "1"
regex-syntax = "0.8"
lsp-server = "0.7"
url = "=2.5.2"
unicode-width = { version = "0.2", default-features = false }

[dev-dependencies]
wasm-encoder = { version = "=0.225.0", default-features = false }

